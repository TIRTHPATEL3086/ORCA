# Render Blueprint: one-click deploy of the ORCA API and its PostGIS database.
# Render dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: orca-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orca-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: APP_ENV
        value: production
      # "dev" shows the OTP in the app (testing only). "sms_gate" sends a
      # real SMS through SMS Gateway for Android and never shows the code.
      - key: OTP_PROVIDER
        value: dev
      # Credentials from the SMS Gateway app (Cloud Server section).
      # Set these in the Render dashboard; they are not stored in git.
      - key: SMS_GATE_USERNAME
        sync: false
      - key: SMS_GATE_PASSWORD
        sync: false
      - key: OTP_EXPIRE_MINUTES
        value: "5"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"

databases:
  - name: orca-db
    databaseName: orca
    plan: free
