# Render Blueprint: one-click deploy of the ORCA API and its PostGIS database.
# Render dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: orca-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orca-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      # "development" shows the OTP in the app because no SMS provider is
      # connected yet. Switch to "production" once SMS delivery is added.
      - key: APP_ENV
        value: development
      - key: OTP_EXPIRE_MINUTES
        value: "5"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"

databases:
  - name: orca-db
    databaseName: orca
    plan: free
